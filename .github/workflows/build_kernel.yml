name: Build KernelSU Kernel for itel S665L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses-dev python3 unzip zip cpio lz4

      - name: Clone Bocchi UMS9230 kernel source (5.4.254)
        run: |
          git clone --depth=1 https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git kernel
          cd kernel
          head -4 Makefile

      - name: Install KernelSU v0.9.5 (download release)
        run: |
          mkdir -p kernel/drivers/kernelsu
          curl -L "https://github.com/tiann/KernelSU/archive/refs/tags/v0.9.5.tar.gz" -o /tmp/ksu.tar.gz
          tar xzf /tmp/ksu.tar.gz -C /tmp/
          ls /tmp/KernelSU-0.9.5/kernel/
          cp -r /tmp/KernelSU-0.9.5/kernel/* kernel/drivers/kernelsu/
          echo "KSU files:"
          ls kernel/drivers/kernelsu/Kconfig

      - name: Setup defconfig
        run: |
          cd kernel
          cp arch/arm64/configs/bg6-stock_defconfig arch/arm64/configs/itel_s665l_defconfig
          # Set LOCALVERSION
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-android12-9"/' arch/arm64/configs/itel_s665l_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' arch/arm64/configs/itel_s665l_defconfig
          # Enable KernelSU
          echo "" >> arch/arm64/configs/itel_s665l_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/itel_s665l_defconfig
          # DRM_SPRD as module
          echo "CONFIG_DRM_SPRD=m" >> arch/arm64/configs/itel_s665l_defconfig
          echo "CONFIG_DRM_SPRD_DPU0=y" >> arch/arm64/configs/itel_s665l_defconfig
          echo "CONFIG_DRM_SPRD_DSI=y" >> arch/arm64/configs/itel_s665l_defconfig

      - name: Apply defconfig
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- itel_s665l_defconfig
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODVERSIONS|CONFIG_DRM_SPRD" .config

      - name: Build kernel
        run: |
          cd kernel
          echo "Build started: $(date)"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules
          echo "Build finished: $(date)"
          ls -lh arch/arm64/boot/Image
          echo "Modules: $(find . -name '*.ko' | wc -l)"

      - name: Package artifacts
        if: success()
        run: |
          mkdir -p output/modules
          cp kernel/arch/arm64/boot/Image output/
          find kernel -name "*.ko" -exec cp {} output/modules/ \;
          ls -lh output/Image
          echo "Total modules: $(ls output/modules/ | wc -l)"

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-kernel-itel-s665l
          path: output/
          retention-days: 30