name: Build KernelSU Kernel for itel S665L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses-dev python3 unzip zip cpio lz4

      - name: Clone Bocchi UMS9230 kernel source (5.4.254)
        run: |
          git clone --depth=1 https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git kernel
          cd kernel
          echo "Source version:"
          head -4 Makefile

      - name: Clone KernelSU v0.9.5
        run: |
          git clone https://github.com/tiann/KernelSU.git /tmp/ksu
          cd /tmp/ksu
          git checkout v0.9.5
          echo "KernelSU tag:"
          git describe --tags --exact-match
          mkdir -p ${{ github.workspace }}/kernel/drivers/kernelsu
          cp -r /tmp/ksu/kernel/* ${{ github.workspace }}/kernel/drivers/kernelsu/
          echo "KernelSU files:"
          ls ${{ github.workspace }}/kernel/drivers/kernelsu/Kconfig

      - name: Setup defconfig
        run: |
          cd kernel
          cp arch/arm64/configs/bg6-stock_defconfig arch/arm64/configs/itel_s665l_defconfig
          # Set LOCALVERSION to match stock vermagic
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-android12-9"/' arch/arm64/configs/itel_s665l_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' arch/arm64/configs/itel_s665l_defconfig
          # Enable KernelSU
          cat >> arch/arm64/configs/itel_s665l_defconfig << 'EOF'

          # KernelSU
          CONFIG_KSU=y
          EOF
          # Enable DRM_SPRD as module (stock = module)
          cat >> arch/arm64/configs/itel_s665l_defconfig << 'EOF'

          # Display drivers (stock = module)
          CONFIG_DRM_SPRD=m
          CONFIG_DRM_SPRD_DPU0=y
          CONFIG_DRM_SPRD_DSI=y
          EOF

      - name: Apply defconfig
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- itel_s665l_defconfig
          echo "=== Critical Configs ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODVERSIONS|CONFIG_DRM_SPRD|CONFIG_PSTORE" .config | head -20

      - name: Build kernel
        run: |
          cd kernel
          echo "Build started: $(date)"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image modules 2>&1 | tail -50
          echo "Build finished: $(date)"
          echo "Image size:"
          ls -lh arch/arm64/boot/Image
          echo "Module count:"
          find . -name "*.ko" | wc -l

      - name: Package artifacts
        if: success()
        run: |
          mkdir -p output/modules
          cp kernel/arch/arm64/boot/Image output/Image
          find kernel -name "*.ko" -exec cp {} output/modules/ \;
          ls -lh output/Image
          echo "Modules:"
          ls output/modules/ | head -20
          echo "Total modules: $(ls output/modules/ | wc -l)"

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-kernel-itel-s665l
          path: |
            output/Image
            output/modules/*.ko
          retention-days: 30