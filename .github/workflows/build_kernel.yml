name: Build KernelSU Kernel for itel S665L
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses-dev python3 unzip zip cpio lz4

      - name: Clone kernel + KernelSU
        run: |
          git clone --depth=1 https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git kernel
          head -4 kernel/Makefile

          curl -L -o /tmp/ksu.tar.gz "https://github.com/tiann/KernelSU/archive/refs/tags/v0.9.5.tar.gz"
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          tar xzf /tmp/ksu.tar.gz --strip-components=2 -C kernel/drivers/kernelsu KernelSU-0.9.5/kernel/
          ls kernel/drivers/kernelsu/Kconfig

      - name: Gut problematic drivers
        run: |
          cd kernel

          # Remove hybridswap lines from zram Makefile/Kconfig (missing headers)
          python3 -c "
          for f in ['drivers/block/zram/Makefile', 'drivers/block/zram/Kconfig']:
              with open(f) as fh: lines = fh.readlines()
              with open(f, 'w') as fh:
                  for line in lines:
                      if 'hybridswap' in line.lower() or 'HYBRIDSWAP' in line:
                          continue
                      fh.write(line)
          "

          # Remove trusty and sfp dirs + parent Kconfig references
          rm -rf drivers/trusty drivers/soc/sprd/sfp
          sed -i '/trusty/d' drivers/Kconfig drivers/Makefile
          sed -i '/sfp/d' drivers/soc/sprd/Kconfig drivers/soc/sprd/Makefile

          echo "Verify gutted:"
          grep -ri 'hybridswap' drivers/block/zram/ || echo "  zram: no hybridswap OK"
          grep 'trusty' drivers/Kconfig || echo "  drivers/Kconfig: no trusty OK"
          grep 'sfp' drivers/soc/sprd/Kconfig || echo "  sprd/Kconfig: no sfp OK"

      - name: Setup defconfig
        run: |
          cd kernel
          cp arch/arm64/configs/bg6-stock_defconfig arch/arm64/configs/itel_s665l_defconfig

          # Match stock vermagic exactly
          sed -i 's/^CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-android12-9"/' arch/arm64/configs/itel_s665l_defconfig
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' arch/arm64/configs/itel_s665l_defconfig

          # Enable KernelSU
          echo '' >> arch/arm64/configs/itel_s665l_defconfig
          echo 'CONFIG_OVERLAY_FS=y' >> arch/arm64/configs/itel_s665l_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/itel_s665l_defconfig

          # Disable problematic configs in defconfig
          echo '# CONFIG_TRUSTY is not set' >> arch/arm64/configs/itel_s665l_defconfig
          echo '# CONFIG_SPRD_SFP is not set' >> arch/arm64/configs/itel_s665l_defconfig
          echo '# CONFIG_HYBRIDSWAP is not set' >> arch/arm64/configs/itel_s665l_defconfig
          echo '# CONFIG_CORESIGHT is not set' >> arch/arm64/configs/itel_s665l_defconfig

      - name: Apply defconfig
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- itel_s665l_defconfig

          # Force disable after olddefconfig (Kconfig default=y re-enables)
          scripts/config --disable HYBRIDSWAP
          scripts/config --disable HYBRIDSWAP_SWAPD
          scripts/config --disable HYBRIDSWAP_CORE
          scripts/config --disable HYBRIDSWAP_ASYNC_COMPRESS
          scripts/config --disable TRUSTY
          scripts/config --disable SPRD_SFP
          scripts/config --disable CORESIGHT
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== Verify disabled ==="
          grep -E 'CONFIG_HYBRIDSWAP=|CONFIG_TRUSTY=|CONFIG_SPRD_SFP=' .config || echo "All disabled!"

      - name: Build kernel
        id: build
        run: |
          cd kernel
          echo "Build started: $(date)"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" -j$(nproc) Image modules 2>&1 | tee /tmp/build.log
          BUILD_EXIT=$?
          echo "Build finished: $(date)"
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          ls -lh arch/arm64/boot/Image 2>/dev/null
          echo "Modules: $(find . -name '*.ko' 2>/dev/null | wc -l)"
          exit $BUILD_EXIT

      - name: Upload build log on failure
        if: failure()
        run: |
          cd kernel
          echo "=== LAST 50 LINES ==="
          tail -50 /tmp/build.log 2>/dev/null
          echo "=== ERRORS ==="
          grep -i 'error:\|Error\|fatal' /tmp/build.log 2>/dev/null | tail -20

      - name: Package
        if: success()
        run: |
          mkdir -p /tmp/output/modules
          cp kernel/arch/arm64/boot/Image /tmp/output/
          find kernel -name "*.ko" -exec cp {} /tmp/output/modules/ \;
          cd /tmp/output
          zip -r $GITHUB_WORKSPACE/itel-s665l-kernelsu-$(date +%Y%m%d).zip Image modules/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-kernel-${{ github.run_number }}
          path: itel-s665l-kernelsu-*.zip
          retention-days: 30
